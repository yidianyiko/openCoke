schema: coke-ownership-registry-v1

systems:
  - frontend-app
  - identity-access
  - channel-reachability
  - conversation-runtime
  - reminder
  - social-scheduling
  - calendar-import
  - settings
  - turn
  - provider-adapters
  - state-infrastructure
  - repo-os

routes:
  - path: coke/api/account_routes.py
    owner: identity-access
  - path: coke/api/auth_routes.py
    owner: identity-access
  - path: coke/api/calendar_import_routes.py
    owner: calendar-import
  - path: coke/api/channel_routes.py
    owner: channel-reachability
    secondary_owner: identity-access
  - path: coke/api/claim_routes.py
    owner: identity-access
  - path: coke/api/friend_routes.py
    owner: social-scheduling
  - path: coke/api/internal_routes.py
    owner: conversation-runtime
    secondary_owner: provider-adapters
  - path: coke/api/provider_webhooks.py
    owner: provider-adapters
    secondary_owner: channel-reachability
  - path: coke/api/reminder_routes.py
    owner: reminder
  - path: coke/api/shared_reminder_routes.py
    owner: social-scheduling
    secondary_owner: reminder
  - path: coke/api/settings_routes.py
    owner: settings
  - path: coke/api/subscription_routes.py
    owner: identity-access

contracts:
  - path: coke/app.py
    owner: state-infrastructure
  - path: coke/schema.py
    owner: state-infrastructure
  - path: migrations/env.py
    owner: state-infrastructure
  - path: web/OWNERS.md
    owner: frontend-app
