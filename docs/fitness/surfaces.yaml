schema: coke-guardrails-v1

surfaces:
  - name: repo-os-docs
    paths:
      - AGENTS.md
      - CLAUDE.md
      - README.md
      - docs/ARCHITECTURE.md
      - docs/architecture.md
      - docs/design-docs/**
      - docs/adr/**
      - docs/fitness/README.md
      - docs/fitness/coke-verification-matrix.md
      - docs/issues/**
      - docs/product-specs/**
      - docs/release-guide.md
      - docs/RELEASE_CHECKLIST.md
      - docs/superpowers/**
      - artifacts/evidence/**

  - name: worker-runtime
    paths:
      - agent/runner/**
      - agent/agno_agent/adapters/**
      - agent/agno_agent/capabilities/**
      - agent/agno_agent/model_factory.py
      - agent/agno_agent/prompts/**
      - agent/agno_agent/runtime/**
      - agent/agno_agent/schemas/**
      - agent/agno_agent/tools/**
      - agent/agno_agent/workflows/**
      - agent/agno_agent/utils/**
      - agent/prompt/**
      - agent/reminder/**
      - dao/reminder_dao.py

  - name: product-reminder
    paths:
      - agent/reminder/**
      - agent/runner/reminder_*.py
      - gateway/packages/api/src/routes/customer-reminder-routes.ts
      - connector/clawscale_bridge/reminder_management_service.py
      - dao/reminder_dao.py

  - name: product-memo
    paths:
      - memo-runtime/**
      - agent/agno_agent/capabilities/memo.py

  - name: product-calendar-import
    paths:
      - gateway/packages/api/src/routes/customer-google-calendar-import-routes.ts
      - gateway/packages/api/src/routes/customer-google-calendar-import-callback-routes.ts
      - gateway/packages/api/src/routes/calendar-import-handoff-routes.ts
      - gateway/packages/api/src/lib/google-calendar-*
      - gateway/packages/api/src/lib/calendar-import-handoff.ts
      - connector/clawscale_bridge/google_calendar_import_service.py
      - agent/agno_agent/capabilities/calendar_import_port.py
      - agent/agno_agent/tools/calendar_import_handoff.py

  - name: product-timezone
    paths:
      - agent/timezone_service.py
      - agent/agno_agent/capabilities/timezone_port.py
      - agent/agno_agent/tools/timezone_tools.py
      - dao/user_dao.py

  - name: bridge
    paths:
      - connector/clawscale_bridge/**

  - name: gateway-api
    paths:
      - gateway/packages/api/**
      - gateway/packages/shared/**

  - name: gateway-web
    paths:
      - gateway/packages/web/**

  - name: deploy
    paths:
      - docker-compose.prod.yml
      - deploy/**
      - scripts/deploy-*.sh
      - scripts/test-deploy-compose-to-gcp.sh
      - docs/deploy.md

  - name: repo-os
    paths:
      - docs/fitness/surfaces.yaml
      - scripts/check
      - scripts/verify-surface
      - scripts/suggest-verification
      - scripts/review-trigger
      - scripts/guardrails.py
      - tests/unit/test_repo_os_structure.py
      - tests/unit/test_guardrail_scripts.py

review_triggers:
  - name: cross_boundary_bridge_gateway
    type: cross_boundary_change
    severity: high
    boundaries:
      bridge:
        - connector/clawscale_bridge/**
      gateway:
        - gateway/packages/api/**
        - gateway/packages/shared/**
    min_boundaries: 2

  - name: cross_boundary_worker_bridge
    type: cross_boundary_change
    severity: medium
    boundaries:
      worker-runtime:
        - agent/runner/**
        - agent/agno_agent/**
        - agent/prompt/**
      bridge:
        - connector/clawscale_bridge/**
    min_boundaries: 2

  - name: sensitive_repo_os_change
    type: changed_paths
    severity: medium
    paths:
      - AGENTS.md
      - CLAUDE.md
      - docs/ARCHITECTURE.md
      - docs/fitness/**
      - docs/design-docs/**
      - docs/issues/**
      - docs/product-specs/**
      - docs/release-guide.md
      - docs/RELEASE_CHECKLIST.md
      - docs/superpowers/**
      - scripts/check
      - scripts/verify-surface
      - scripts/suggest-verification
      - scripts/review-trigger
      - scripts/guardrails.py

  - name: deploy_surface_change
    type: changed_paths
    severity: high
    paths:
      - docker-compose.prod.yml
      - deploy/**
      - scripts/deploy-*.sh
      - scripts/test-deploy-compose-to-gcp.sh

  - name: oversized_change
    type: diff_size
    severity: medium
    max_files: 12
    max_added_lines: 600
    max_deleted_lines: 400

  - name: evidence_gap
    type: evidence_gap
    severity: medium
    paths:
      - agent/**
      - connector/**
      - gateway/packages/**
      - dao/**
      - entity/**
      - util/**
      - framework/**
      - deploy/**
      - scripts/deploy-*.sh
      - scripts/test-deploy-compose-to-gcp.sh
    evidence_paths:
      - artifacts/evidence/**
