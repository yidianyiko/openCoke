schema: coke-guardrails-v1

surfaces:
  - name: clean-rebuild-docs
    description: Canonical docs agree on the clean target architecture.
    paths:
      - docs/ARCHITECTURE.md
      - docs/product-specs/FEATURE_TREE.md
      - docs/roadmap.md
      - docs/clawscale_bridge.md
      - docs/deploy.md
      - docs/design-docs/coke-working-contract.md
      - docs/design-docs/interface-contract.md
      - docs/design-docs/data-retention-policy.md
      - docs/fitness/coke-verification-matrix.md
      - docs/fitness/surfaces.yaml
      - scripts/e2e/clean-rebuild-canonical-doc-sync.sh
    commands:
      - bash scripts/e2e/clean-rebuild-canonical-doc-sync.sh
      - zsh scripts/check

  - name: clean-rebuild-backend
    description: Python domain/API/worker rebuild contracts.
    paths:
      - coke/**
      - migrations/**
      - tests/unit/coke/**
    commands:
      - .venv/bin/python -m pytest tests/unit/coke -v

  - name: clean-rebuild-web
    description: Thin Next.js client over the Python API.
    paths:
      - web/**
    commands:
      - cd web && pnpm test
      - cd web && pnpm build

  - name: repo-os-docs
    paths:
      - AGENTS.md
      - CLAUDE.md
      - README.md
      - docs/ARCHITECTURE.md
      - docs/architecture.md
      - docs/design-docs/**
      - docs/adr/**
      - docs/fitness/README.md
      - docs/fitness/coke-verification-matrix.md
      - docs/issues/**
      - docs/product-specs/**
      - docs/release-guide.md
      - docs/RELEASE_CHECKLIST.md
      - docs/superpowers/**
      - artifacts/evidence/**

  - name: deploy
    paths:
      - Dockerfile
      - docker-compose.prod.yml
      - deploy/**
      - docs/deploy.md

  - name: repo-os
    paths:
      - docs/fitness/surfaces.yaml
      - docs/fitness/ownership-registry.yaml
      - scripts/check
      - scripts/verify-surface
      - scripts/suggest-verification
      - scripts/review-trigger
      - scripts/guardrails.py

review_triggers:
  - name: cross_boundary_backend_web
    type: cross_boundary_change
    severity: medium
    boundaries:
      backend:
        - coke/**
        - migrations/**
      web:
        - web/**
    min_boundaries: 2

  - name: sensitive_repo_os_change
    type: changed_paths
    severity: medium
    paths:
      - AGENTS.md
      - CLAUDE.md
      - docs/ARCHITECTURE.md
      - docs/fitness/**
      - docs/design-docs/**
      - docs/issues/**
      - docs/product-specs/**
      - docs/release-guide.md
      - docs/RELEASE_CHECKLIST.md
      - docs/superpowers/**
      - scripts/check
      - scripts/verify-surface
      - scripts/suggest-verification
      - scripts/review-trigger
      - scripts/guardrails.py

  - name: deploy_surface_change
    type: changed_paths
    severity: high
    paths:
      - Dockerfile
      - docker-compose.prod.yml
      - deploy/**

  - name: oversized_change
    type: diff_size
    severity: medium
    max_files: 12
    max_added_lines: 600
    max_deleted_lines: 400

  - name: evidence_gap
    type: evidence_gap
    severity: medium
    paths:
      - coke/**
      - migrations/**
      - web/**
      - deploy/**
      - Dockerfile
      - docker-compose.prod.yml
    evidence_paths:
      - artifacts/evidence/**
