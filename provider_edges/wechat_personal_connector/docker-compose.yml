services:
  wechat-personal-connector:
    build:
      context: ../..
      dockerfile: provider_edges/wechat_personal_connector/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      WECHAT_CONNECTOR_WEBHOOK_URL: ${WECHAT_CONNECTOR_WEBHOOK_URL:-http://coke-api:8000/webhooks/wechat/personal}
      WECHAT_CONNECTOR_AUTOSTART_POLL: ${WECHAT_CONNECTOR_AUTOSTART_POLL:-1}
    ports:
      - "${WECHAT_CONNECTOR_BIND:-0.0.0.0}:${WECHAT_CONNECTOR_PORT:-8095}:8095"
    volumes:
      - wechat_personal_state:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - coke_clean

volumes:
  wechat_personal_state:

networks:
  coke_clean:
    external: true
    name: "${WECHAT_CONNECTOR_COKE_NETWORK:-coke-clean_default}"
