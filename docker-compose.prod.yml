services:
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: coke
      POSTGRES_PASSWORD: coke
      POSTGRES_DB: coke
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coke -d coke"]
      interval: 10s
      timeout: 5s
      retries: 10

  coke-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://coke:coke@postgres:5432/coke
      REDIS_URL: redis://redis:6379/0
      AGNO_TELEMETRY: "false"
    command:
      [
        "python",
        "-c",
        "from coke.app import create_app; from coke.config import Settings; create_app(Settings.from_env()).run(host='0.0.0.0', port=8000)",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:8000:8000"

  coke-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://coke:coke@postgres:5432/coke
      REDIS_URL: redis://redis:6379/0
      AGNO_TELEMETRY: "false"
    command:
      [
        "python",
        "-c",
        "from coke.worker.stream_consumer import StreamConsumer; import time; print('coke-worker entrypoint requires integration wiring'); time.sleep(3600)",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  coke-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://coke:coke@postgres:5432/coke
      REDIS_URL: redis://redis:6379/0
      AGNO_TELEMETRY: "false"
    command:
      [
        "python",
        "-c",
        "from coke.domains.reminder.scheduler import ReminderScheduler; import time; print('coke-scheduler entrypoint requires integration wiring'); time.sleep(3600)",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  coke-outbox-relay:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://coke:coke@postgres:5432/coke
      REDIS_URL: redis://redis:6379/0
      AGNO_TELEMETRY: "false"
    command:
      [
        "python",
        "-c",
        "from coke.worker.outbox_relay import OutboxRelay; import time; print('coke-outbox-relay entrypoint requires integration wiring'); time.sleep(3600)",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  coke-web:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://coke.keep4oforever.com}
      NEXT_PUBLIC_COKE_WEB_URL: ${NEXT_PUBLIC_COKE_WEB_URL:-https://coke.keep4oforever.com}
    command:
      [
        "sh",
        "-lc",
        "corepack enable && pnpm install --frozen-lockfile=false && pnpm build && pnpm start",
      ]
    volumes:
      - ./web:/app
    depends_on:
      coke-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:4040:4040"

volumes:
  redis_data:
  postgres_data:
